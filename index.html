<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>R Snake Retro Game</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for Retro Pixel look -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
        /* Custom Retro Font & Nokia Screen FX */
        body {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .font-lcd { font-family: 'VT323', monospace; }
        .font-pixel { font-family: 'Press Start 2P', cursive; }

        /* Nokia LCD Screen Themes */
        .theme-3310 {
            background-color: #c7d8b5;
            color: #2b3925;
            border-color: #2b3925;
        }
        .theme-1100 {
            background-color: #a8b896;
            color: #1a2415;
            border-color: #1a2415;
        }
        .theme-matrix {
            background-color: #0d1b0e;
            color: #33ff33;
            border-color: #33ff33;
        }
        .theme-matrix .pixel-on {
            background-color: #33ff33;
            box-shadow: 0 0 4px #33ff33;
        }

        /* Scanlines Overlay */
        .lcd-overlay {
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.08) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
        }

        /* Phone Keypad Button Effects */
        .nokia-btn {
            background: linear-gradient(145deg, #3a3f47, #24282e);
            box-shadow: 2px 2px 5px #1a1c21, -2px -2px 5px #4a525d;
            transition: all 0.05s ease;
        }
        .nokia-btn:active, .nokia-btn.active-key {
            box-shadow: inset 2px 2px 4px #1a1c21, inset -2px -2px 4px #4a525d;
            transform: translateY(2px);
        }

        .nav-btn {
            background: linear-gradient(145deg, #4f5663, #353b44);
            box-shadow: 2px 2px 4px #1c2026, -2px -2px 4px #5e6676;
        }
        .nav-btn:active {
            box-shadow: inset 2px 2px 4px #1c2026;
            transform: translateY(1px);
        }

        /* Hide scrollbars for app feel */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between items-center select-none font-lcd overflow-hidden">

    <!-- Simulated Android Top Status Bar -->
    <div class="w-full bg-slate-900 text-slate-400 text-xs px-4 py-1 flex justify-between items-center border-b border-slate-800 font-sans z-50">
        <div class="flex items-center space-x-2">
            <span id="android-time">12:00</span>
            <span class="text-[10px] bg-emerald-700 text-white px-1.5 py-0.5 rounded">Game Mode</span>
        </div>
        <div class="flex items-center space-x-2">
            <svg class="w-3 h-3 fill-current" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19.4c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l1.9-1.9C9.2 19.54 10.56 20 12 20c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 15c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/></svg>
            <span class="text-[10px]">100%</span>
        </div>
    </div>

    <!-- Main Mobile Container -->
    <div class="w-full max-w-sm flex-1 flex flex-col items-center justify-between p-3 relative my-auto">
        
        <!-- Phone Shell Body -->
        <div class="w-full bg-gradient-to-b from-slate-800 via-slate-850 to-slate-900 p-4 rounded-[36px] shadow-2xl border-4 border-slate-700 flex flex-col items-center relative">
            
            <!-- Nokia Branding Header -->
            <div class="w-full flex justify-between items-center mb-2 px-2">
                <span class="font-bold tracking-widest text-base text-slate-300 font-pixel">R Snake</span>
                <div class="flex items-center space-x-2">
                    <div class="w-8 h-1.5 bg-slate-950 rounded-full border border-slate-700"></div>
                    <span class="text-[10px] text-slate-400 font-mono" id="model-text">Snake</span>
                </div>
            </div>

            <!-- LCD Screen Container -->
            <div class="w-full p-3 bg-slate-950 rounded-2xl border-2 border-slate-700 shadow-inner flex flex-col items-center">
                
                <!-- LCD Screen -->
                <div id="lcd-screen" class="theme-3310 w-full rounded-md p-2 relative overflow-hidden transition-colors duration-300 border shadow-inner">
                    <div class="lcd-overlay absolute inset-0 z-10"></div>

                    <!-- Top Bar Stats -->
                    <div class="flex justify-between items-center border-b pb-1 font-pixel text-[9px] tracking-tight z-20 relative">
                        <div>SCORE:<span id="score">0</span></div>
                        <div>HI:<span id="high-score">0</span></div>
                    </div>

                    <!-- Game Canvas (Swipeable Area) -->
                    <div id="touch-area" class="relative my-1 flex justify-center items-center touch-none">
                        <canvas id="gameCanvas" width="220" height="220" class="block border border-current opacity-90"></canvas>
                        
                        <!-- Overlay Screens -->
                        <div id="screen-overlay" class="absolute inset-0 bg-opacity-95 flex flex-col justify-center items-center p-2 text-center z-30">
                            <h1 id="overlay-title" class="font-pixel text-xs mb-1">SNAKE MOBILE</h1>
                            <p id="overlay-msg" class="text-base leading-tight mb-2">Tap 5 / Play or Swipe Screen</p>
                            <div class="text-[11px] space-y-0.5 opacity-90">
                                <p>Swipe: UP/DOWN/LEFT/RIGHT</p>
                                <p>Keys: 2, 8, 4, 6</p>
                            </div>
                        </div>
                    </div>

                    <!-- Bottom Bar Settings -->
                    <div class="flex justify-between items-center text-[10px] border-t pt-1 font-mono z-20 relative">
                        <span id="diff-label">LVL: EASY</span>
                        <span id="sound-label">🔊 ON</span>
                        <span id="mode-label">SWIPE ON</span>
                    </div>
                </div>
            </div>

            <!-- Controls Pad -->
            <div class="w-full mt-3 flex flex-col items-center space-y-2">
                <!-- Soft Action Buttons -->
                <div class="w-full flex justify-between items-center px-2">
                    <button id="btn-soft-left" class="nav-btn px-3 py-1.5 rounded-lg text-[10px] font-bold text-slate-200 border border-slate-600 shadow">
                        PAUSE
                    </button>
                    <button id="btn-diff" class="nav-btn px-3 py-1.5 rounded-lg text-[10px] font-bold text-yellow-400 border border-slate-600 shadow">
                        DIFF
                    </button>
                    <button id="btn-center" class="nav-btn px-4 py-1.5 rounded-full font-bold text-xs text-emerald-400 border border-slate-600 shadow">
                        PLAY / 5
                    </button>
                    <button id="btn-soft-right" class="nav-btn px-3 py-1.5 rounded-lg text-[10px] font-bold text-slate-200 border border-slate-600 shadow">
                        RESET
                    </button>
                </div>

                <!-- Number Keypad -->
                <div class="grid grid-cols-3 gap-1.5 w-full px-2 pt-1">
                    <button class="key-btn nokia-btn h-9 rounded-lg text-slate-200 font-bold flex flex-col items-center justify-center border border-slate-700" data-key="1">
                        <span class="text-xs">1</span>
                    </button>
                    <button id="btn-up" class="key-btn nokia-btn h-9 rounded-lg text-slate-100 font-bold flex flex-col items-center justify-center border border-slate-600 bg-slate-700" data-key="2">
                        <span class="text-[10px] text-emerald-400">▲</span>
                        <span class="text-xs">2</span>
                    </button>
                    <button class="key-btn nokia-btn h-9 rounded-lg text-slate-200 font-bold flex flex-col items-center justify-center border border-slate-700" data-key="3">
                        <span class="text-xs">3</span>
                    </button>

                    <button id="btn-left" class="key-btn nokia-btn h-9 rounded-lg text-slate-100 font-bold flex justify-center items-center space-x-1 border border-slate-600 bg-slate-700" data-key="4">
                        <span class="text-[10px] text-emerald-400">◄</span>
                        <span class="text-xs">4</span>
                    </button>
                    <button id="btn-action" class="key-btn nokia-btn h-9 rounded-lg text-slate-100 font-bold flex justify-center items-center border border-slate-700" data-key="5">
                        <span class="text-xs text-yellow-400">5</span>
                    </button>
                    <button id="btn-right" class="key-btn nokia-btn h-9 rounded-lg text-slate-100 font-bold flex justify-center items-center space-x-1 border border-slate-600 bg-slate-700" data-key="6">
                        <span class="text-xs">6</span>
                        <span class="text-[10px] text-emerald-400">►</span>
                    </button>

                    <button class="key-btn nokia-btn h-9 rounded-lg text-slate-200 font-bold flex flex-col items-center justify-center border border-slate-700" data-key="7">
                        <span class="text-xs">7</span>
                    </button>
                    <button id="btn-down" class="key-btn nokia-btn h-9 rounded-lg text-slate-100 font-bold flex flex-col items-center justify-center border border-slate-600 bg-slate-700" data-key="8">
                        <span class="text-xs">8</span>
                        <span class="text-[10px] text-emerald-400">▼</span>
                    </button>
                    <button class="key-btn nokia-btn h-9 rounded-lg text-slate-200 font-bold flex flex-col items-center justify-center border border-slate-700" data-key="9">
                        <span class="text-xs">9</span>
                    </button>

                    <button id="btn-theme" class="key-btn nokia-btn h-8 rounded-lg text-[10px] text-cyan-300 font-bold flex items-center justify-center border border-slate-700" data-key="*">
                        COLOR
                    </button>
                    <button class="key-btn nokia-btn h-8 rounded-lg text-xs text-slate-200 font-bold flex items-center justify-center border border-slate-700" data-key="0">
                        0
                    </button>
                    <button id="btn-sound" class="key-btn nokia-btn h-8 rounded-lg text-[10px] text-amber-300 font-bold flex items-center justify-center border border-slate-700" data-key="#">
                        SOUND
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        // Realtime Clock for Android Header
        function updateClock() {
            const now = new Date();
            document.getElementById('android-time').textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Audio Engine
        class RetroAudio {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }
            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
            }
            playTone(freq, type = 'square', duration = 0.08, vol = 0.1) {
                if (!this.enabled) return;
                try {
                    this.init();
                    if (this.ctx.state === 'suspended') this.ctx.resume();
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch (e) {}
            }
            keyClick() { this.playTone(800, 'square', 0.03, 0.05); }
            eat() {
                this.playTone(1200, 'square', 0.05, 0.12);
                setTimeout(() => this.playTone(1600, 'square', 0.06, 0.12), 50);
            }
            turn() { this.playTone(400, 'square', 0.02, 0.03); }
            gameOver() {
                [600, 500, 400, 300, 200].forEach((freq, idx) => {
                    setTimeout(() => this.playTone(freq, 'sawtooth', 0.12, 0.15), idx * 90);
                });
            }
        }

        const audio = new RetroAudio();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const GRID_SIZE = 15;
        const CELL_SIZE = canvas.width / GRID_SIZE;

        let snake = [];
        let food = { x: 0, y: 0 };
        let dir = { x: 1, y: 0 };
        let nextDir = { x: 1, y: 0 };
        let score = 0;
        let highScore = localStorage.getItem('nokia_snake_hi') || 0;
        
        // Difficulties: Easy, Medium, Hard
        const speeds = { 'EASY': 140, 'MED': 100, 'HARD': 60 };
        let currentDiff = 'EASY';
        let gameSpeed = speeds[currentDiff];
        
        let gameLoop = null;
        let isRunning = false;
        let isPaused = false;
        let isGameOver = false;

        const themes = ['3310', '1100', 'matrix'];
        let currentThemeIdx = 0;
        const themeColors = {
            '3310': { bg: '#c7d8b5', dark: '#2b3925', grid: '#b5c6a3' },
            '1100': { bg: '#a8b896', dark: '#1a2415', grid: '#97a685' },
            'matrix': { bg: '#0d1b0e', dark: '#33ff33', grid: '#132815' }
        };

        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('high-score');
        const overlayEl = document.getElementById('screen-overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayMsg = document.getElementById('overlay-msg');
        const lcdScreen = document.getElementById('lcd-screen');
        const modelText = document.getElementById('model-text');
        const soundLabel = document.getElementById('sound-label');
        const diffLabel = document.getElementById('diff-label');

        highScoreEl.textContent = highScore;

        function initGame() {
            snake = [
                { x: 5, y: 7 },
                { x: 4, y: 7 },
                { x: 3, y: 7 }
            ];
            dir = { x: 1, y: 0 };
            nextDir = { x: 1, y: 0 };
            score = 0;
            scoreEl.textContent = score;
            spawnFood();
            isGameOver = false;
            isPaused = false;
        }

        function spawnFood() {
            let valid = false;
            while (!valid) {
                food.x = Math.floor(Math.random() * GRID_SIZE);
                food.y = Math.floor(Math.random() * GRID_SIZE);
                valid = !snake.some(seg => seg.x === food.x && seg.y === food.y);
            }
        }

        function update() {
            if (!isRunning || isPaused || isGameOver) return;
            dir = { ...nextDir };
            const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

            if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE ||
                snake.some(seg => seg.x === head.x && seg.y === head.y)) {
                triggerGameOver();
                return;
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.textContent = score;
                audio.eat();
                if (score > highScore) {
                    highScore = score;
                    highScoreEl.textContent = highScore;
                    localStorage.setItem('nokia_snake_hi', highScore);
                }
                spawnFood();
            } else {
                snake.pop();
            }

            render();
        }

        function render() {
            const colors = themeColors[themes[currentThemeIdx]];
            ctx.fillStyle = colors.bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = colors.grid;
            ctx.lineWidth = 1;
            for (let i = 0; i <= GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * CELL_SIZE, 0);
                ctx.lineTo(i * CELL_SIZE, canvas.height);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i * CELL_SIZE);
                ctx.lineTo(canvas.width, i * CELL_SIZE);
                ctx.stroke();
            }

            snake.forEach((seg, index) => {
                ctx.fillStyle = colors.dark;
                ctx.fillRect(
                    seg.x * CELL_SIZE + (index === 0 ? 1 : 1.5), 
                    seg.y * CELL_SIZE + (index === 0 ? 1 : 1.5), 
                    CELL_SIZE - (index === 0 ? 2 : 3), 
                    CELL_SIZE - (index === 0 ? 2 : 3)
                );
            });

            ctx.fillStyle = colors.dark;
            const fx = food.x * CELL_SIZE;
            const fy = food.y * CELL_SIZE;
            ctx.fillRect(fx + 3, fy + 3, CELL_SIZE - 6, CELL_SIZE - 6);
            ctx.clearRect(fx + 5, fy + 5, CELL_SIZE - 10, CELL_SIZE - 10);
            ctx.fillRect(fx + 6, fy + 6, CELL_SIZE - 12, CELL_SIZE - 12);
        }

        function changeDirection(newDir) {
            if (!isRunning) return;
            if (newDir.x === -dir.x && newDir.y === -dir.y) return;
            if (dir.x !== newDir.x || dir.y !== newDir.y) audio.turn();
            nextDir = newDir;
        }

        function startGame() {
            initGame();
            isRunning = true;
            overlayEl.classList.add('hidden');
            render();
            clearInterval(gameLoop);
            gameLoop = setInterval(update, gameSpeed);
        }

        function togglePause() {
            if (!isRunning || isGameOver) return;
            isPaused = !isPaused;
            if (isPaused) {
                overlayTitle.textContent = "PAUSED";
                overlayMsg.textContent = "Press PAUSE or PLAY to Resume";
                overlayEl.classList.remove('hidden');
            } else {
                overlayEl.classList.add('hidden');
            }
        }

        function triggerGameOver() {
            isGameOver = true;
            isRunning = false;
            clearInterval(gameLoop);
            audio.gameOver();
            overlayTitle.textContent = "GAME OVER!";
            overlayMsg.textContent = `Score: ${score}\nTap PLAY / 5 to Restart`;
            overlayEl.classList.remove('hidden');
        }

        // --- Touch Swipe Control Support ---
        let touchStartX = 0;
        let touchStartY = 0;
        const touchArea = document.getElementById('touch-area');

        touchArea.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
            audio.init();
        }, false);

        touchArea.addEventListener('touchend', (e) => {
            if (!isRunning && !isPaused) {
                startGame();
                return;
            }
            const touchEndX = e.changedTouches[0].screenX;
            const touchEndY = e.changedTouches[0].screenY;
            const dx = touchEndX - touchStartX;
            const dy = touchEndY - touchStartY;

            if (Math.abs(dx) > Math.abs(dy)) {
                if (Math.abs(dx) > 20) {
                    if (dx > 0) changeDirection({ x: 1, y: 0 });
                    else changeDirection({ x: -1, y: 0 });
                }
            } else {
                if (Math.abs(dy) > 20) {
                    if (dy > 0) changeDirection({ x: 0, y: 1 });
                    else changeDirection({ x: 0, y: -1 });
                }
            }
        }, false);

        // --- Keyboard Controls ---
        window.addEventListener('keydown', (e) => {
            audio.init();
            switch (e.key) {
                case 'ArrowUp': case 'w': case 'W': case '2':
                    changeDirection({ x: 0, y: -1 }); break;
                case 'ArrowDown': case 's': case 'S': case '8':
                    changeDirection({ x: 0, y: 1 }); break;
                case 'ArrowLeft': case 'a': case 'A': case '4':
                    changeDirection({ x: -1, y: 0 }); break;
                case 'ArrowRight': case 'd': case 'D': case '6':
                    changeDirection({ x: 1, y: 0 }); break;
                case 'Enter': case ' ': case '5':
                    if (!isRunning || isGameOver) startGame();
                    else togglePause();
                    break;
            }
        });

        // Keypad buttons
        document.querySelectorAll('.key-btn, .nav-btn').forEach(button => {
            button.addEventListener('click', () => {
                audio.keyClick();
                const key = button.getAttribute('data-key');
                const id = button.id;

                if (id === 'btn-up' || key === '2') changeDirection({ x: 0, y: -1 });
                else if (id === 'btn-down' || key === '8') changeDirection({ x: 0, y: 1 });
                else if (id === 'btn-left' || key === '4') changeDirection({ x: -1, y: 0 });
                else if (id === 'btn-right' || key === '6') changeDirection({ x: 1, y: 0 });
                else if (id === 'btn-center' || id === 'btn-action' || key === '5') {
                    if (!isRunning || isGameOver) startGame();
                    else togglePause();
                } else if (id === 'btn-soft-left') togglePause();
                else if (id === 'btn-soft-right') {
                    initGame();
                    render();
                    overlayTitle.textContent = "SNAKE MOBILE";
                    overlayMsg.textContent = "Tap 5 / Play or Swipe Screen";
                    overlayEl.classList.remove('hidden');
                    isRunning = false;
                } else if (id === 'btn-diff') cycleDiff();
                else if (id === 'btn-theme' || key === '*') cycleTheme();
                else if (id === 'btn-sound' || key === '#') toggleSound();
            });
        });

        function cycleDiff() {
            if (currentDiff === 'EASY') currentDiff = 'MED';
            else if (currentDiff === 'MED') currentDiff = 'HARD';
            else currentDiff = 'EASY';

            gameSpeed = speeds[currentDiff];
            diffLabel.textContent = `LVL: ${currentDiff}`;
            if (isRunning) restartInterval();
        }

        function restartInterval() {
            clearInterval(gameLoop);
            gameLoop = setInterval(update, gameSpeed);
        }

        function cycleTheme() {
            lcdScreen.classList.remove(`theme-${themes[currentThemeIdx]}`);
            currentThemeIdx = (currentThemeIdx + 1) % themes.length;
            const newTheme = themes[currentThemeIdx];
            lcdScreen.classList.add(`theme-${newTheme}`);
            modelText.textContent = newTheme === 'matrix' ? 'NEO' : newTheme.toUpperCase();
            render();
        }

        function toggleSound() {
            audio.enabled = !audio.enabled;
            soundLabel.textContent = audio.enabled ? "🔊 ON" : "🔇 OFF";
        }

        // Modal Help logic
        const modal = document.getElementById('guide-modal');
        document.getElementById('btn-apk-guide').onclick = () => modal.classList.remove('hidden');
        document.getElementById('btn-close-modal').onclick = () => modal.classList.add('hidden');
        document.getElementById('btn-modal-ok').onclick = () => modal.classList.add('hidden');

        window.onload = () => render();
    </script>
</body>
</html>
